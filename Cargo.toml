[workspace]
members = ["libskel", "skel"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A template Rust workspace: a library crate and the binary built on it."
repository = ""
keywords = []
categories = []

# Every dependency's version lives here; crates use `name.workspace = true`.
# Internal crates are listed too, so a version bump touches this file only.
[workspace.dependencies]
libskel = { path = "libskel", version = "0.1.0", default-features = false }

clap = { version = "4.6.8", features = ["derive"] }
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
strip = true
