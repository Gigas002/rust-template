# cargo-deny policy (docs/ARCHITECTURE.md §7). `cargo deny check` is a quality gate.

[graph]
all-features = true

[advisories]
# RustSec advisories, including "unmaintained" ones, fail the check. Ignoring one needs
# an entry here with a reason, and a line in docs/DECISIONS.md:
# ignore = [{ id = "RUSTSEC-0000-0000", reason = "..." }]
ignore = []

[licenses]
# Permissive licenses only. Add one when a dependency needs it, and say why in
# docs/DECISIONS.md.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
