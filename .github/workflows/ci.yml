# Quality gates on every push and pull request. Each job runs one step of
# scripts/gates.sh, the same script used locally (docs/ARCHITECTURE.md §8).
# Branch protection only needs to require the "CI passed" job.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: scripts/gates.sh fmt

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: typos
      - run: scripts/gates.sh typos

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: scripts/gates.sh deny

  clippy:
    name: clippy (${{ matrix.level }})
    strategy:
      fail-fast: false
      matrix:
        level: [minimal, default, full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.level }}
      - run: scripts/gates.sh clippy ${{ matrix.level }}

  test:
    name: test (${{ matrix.level }})
    strategy:
      fail-fast: false
      matrix:
        level: [minimal, default, full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.level }}
      - run: scripts/gates.sh test ${{ matrix.level }}

  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/gates.sh doc

  stress:
    # Every test binary 10 times in parallel: a flaky test fails here, not months later.
    name: stress
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-full
      - run: scripts/stress.sh 10 --all-features

  coverage:
    name: coverage
    needs: test
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage
        run: |
          scripts/coverage.sh --lcov lcov.info | tee coverage.txt
          { echo '### Coverage'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to Codecov
        # Optional: set the CODECOV_TOKEN secret to enable it.
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ env.CODECOV_TOKEN }}

  ci-passed:
    name: CI passed
    if: always()
    needs: [fmt, typos, deny, clippy, test, doc, stress, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All gates passed."
