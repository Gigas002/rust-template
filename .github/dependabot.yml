# Weekly dependency updates, grouped so one pull request carries a week's worth.
# CI must pass before merging; docs/ARCHITECTURE.md §10 asks for the latest versions.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
